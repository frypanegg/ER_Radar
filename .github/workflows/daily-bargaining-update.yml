name: 일일 교섭현황 수집·반영

# 한국 표준시 06:30 = UTC 21:30 (전날). 법인별 1회 수집 원칙은 수집기 내부의
# 같은 KST 날짜 중복 실행 방지 잠금과 아래 "오늘 수집 필요 여부 판단" 단계로 지킨다.
#
# GitHub의 schedule 이벤트는 보장이 아니라 best-effort다. 부하가 몰리면 지연되고
# 유실되기도 한다. 실제로 2026-08-11 06:30 KST 예정분이 실행되지 않았고, 설정·브랜치·
# 활성 상태·장애 어디에도 원인이 없었다. 그래서 하루에 세 번 시도하고, 정시·30분
# 경계는 부하가 몰리므로 피한다. 첫 시도가 성공하면 나머지는 판단 단계에서 끝난다.
on:
  schedule:
    - cron: "34 21 * * *" # KST 06:34
    - cron: "34 0 * * *" # KST 09:34
    - cron: "34 5 * * *" # KST 14:34
  workflow_dispatch:
    inputs:
      force:
        description: "같은 KST 날짜에 이미 수집했어도 다시 수집하고 재배포"
        type: boolean
        default: false
      trigger_source:
        description: "누가 깨웠는지. Cloudflare cron은 cloudflare-cron을 넘긴다"
        type: string
        default: manual

concurrency:
  group: daily-bargaining-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 예비 스케줄이 하루 세 번 도는 대신, 오늘 KST 날짜의 실행이 이미 성공했으면
      # 여기서 끝낸다. 이렇게 해야 유실 대비 재시도가 커밋·배포 소음을 만들지 않는다.
      - name: 오늘 수집 필요 여부 판단
        id: guard
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          last=$(node -p "String(require('./data/automation-heartbeat.json').lastRunKstDate ?? '')")
          lastOutcome=$(node -p "String(require('./data/automation-heartbeat.json').lastRunOutcome ?? '')")

          echo "오늘(KST): $today · 마지막 실행: ${last:-없음} ($lastOutcome)"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "force 입력이 켜져 있어 다시 수집합니다."
          elif [ "$last" = "$today" ] && [ "$lastOutcome" = "success" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$today KST 수집이 이미 성공했습니다. 예비 스케줄 실행을 건너뜁니다."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # NAVER 자격증명이 없으면 수집기가 알아서 Google News RSS로 동작한다.
      # 시크릿이 등록돼 있으면 그때부터 NAVER를 우선 사용한다.
      - name: 뉴스 후보 수집
        id: collect
        if: steps.guard.outputs.needed == 'true'
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          node scripts/collect-news.mjs \
            --source auto \
            --max-per-query 10 \
            ${{ inputs.force && '--force' || '' }}

      - name: 검증된 사실만 공개 시드에 반영
        id: apply
        if: steps.guard.outputs.needed == 'true'
        run: node scripts/apply-daily-update.mjs

      # 반영 결과가 원칙을 깨뜨렸는지 배포 전에 확인한다.
      # 실패하면 사실 데이터를 커밋하지 않고 되돌린다.
      - name: 회귀 검증
        id: verify
        if: steps.guard.outputs.needed == 'true'
        run: npm test

      # GitHub는 저장소에 60일간 활동이 없으면 스케줄 워크플로를 자동으로 끈다.
      # 수집이나 검증이 실패한 날에도 커밋 한 건은 남도록 실행 흔적을 기록한다.
      - name: 실행 흔적 기록
        if: always() && steps.guard.outputs.needed == 'true'
        env:
          RUN_OUTCOME: ${{ job.status }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          node -e "
            const { readFileSync, writeFileSync } = require('node:fs');
            const kstToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
            const launcher = process.env.TRIGGER_SOURCE;

            // 이전 흔적에서 발사대 기록만 이어받는다. Cloudflare가 깨운 마지막 날짜를
            // 잃어버리면 발사대가 죽었는지 판정할 근거가 사라진다.
            let previous = {};
            try { previous = JSON.parse(readFileSync('data/automation-heartbeat.json', 'utf8')); } catch {}

            writeFileSync('data/automation-heartbeat.json', JSON.stringify({
              schemaVersion: 1,
              note: '스케줄 워크플로 자동 비활성화를 막기 위한 실행 흔적',
              lastRunAt: new Date().toISOString(),
              lastRunKstDate: kstToday,
              lastRunId: process.env.GITHUB_RUN_ID,
              lastRunTrigger: process.env.GITHUB_EVENT_NAME,
              lastLauncher: launcher,
              lastCloudflareLaunchKstDate:
                launcher === 'cloudflare-cron'
                  ? kstToday
                  : previous.lastCloudflareLaunchKstDate ?? null,
              lastRunOutcome: process.env.RUN_OUTCOME,
              collectOutcome: process.env.COLLECT_OUTCOME,
              verifyOutcome: process.env.VERIFY_OUTCOME
            }, null, 2) + '\n');
          "

      - name: 변경 사항 커밋
        id: commit
        if: always() && steps.guard.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 회귀 검증을 통과하지 못했으면 사실 데이터는 되돌리고 실행 흔적만 남긴다.
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "::warning::회귀 검증을 통과하지 못해 사실 데이터를 반영하지 않습니다. 실행 흔적만 기록합니다."

            # 되돌리기 전에 오늘 실제로 무엇을 반영하려 했는지 따로 떠 둔다. 이게 없으면
            # 메일이 되돌려진 어제 파일을 읽어 "반영 0건"만 적고, 막힌 사실이 무엇이었는지
            # 아무 데도 남지 않는다. 2026-08-15에 현대자동차 S4→S3이 그렇게 사라졌다.
            mkdir -p tmp
            cp data/daily-update-audit.json tmp/blocked-audit.json 2>/dev/null || true
            cp public/data/news-candidates.json tmp/blocked-candidates.json 2>/dev/null || true

            git checkout -- \
              public/data/news-candidates.json \
              data/current-2026-fact-seed.json \
              data/daily-update-audit.json 2>/dev/null || true
          else
            git add public/data/news-candidates.json \
                    data/current-2026-fact-seed.json \
                    data/daily-update-audit.json
          fi
          git add data/automation-heartbeat.json

          if git diff --cached --quiet; then
            echo "factsChanged=false" >> "$GITHUB_OUTPUT"
            echo "커밋할 변경이 없습니다."
            exit 0
          fi

          # 공개 사실이 실제로 바뀐 날만 배포를 태운다. 실행 흔적만 바뀐 날은 커밋까지만.
          if git diff --cached --quiet -- data/current-2026-fact-seed.json; then
            echo "factsChanged=false" >> "$GITHUB_OUTPUT"
            git commit -m "Record $(TZ=Asia/Seoul date +%Y-%m-%d) collection run"
          else
            echo "factsChanged=true" >> "$GITHUB_OUTPUT"
            git commit -m "Update bargaining status from $(TZ=Asia/Seoul date +%Y-%m-%d) collection"
          fi

          # 같은 시각에 사람이 밀어 넣은 커밋이 있으면 그 위로 올려 푸시한다.
          git pull --rebase --autostash origin main
          git push

      # 검증이 깨진 날에도 화면은 "n일 지연"만 보여 준다. 배포가 검증 성공에만 걸려
      # 있어서 그날의 실행 흔적이 공개 페이지에 닿지 못하기 때문이다. 사람 눈에는
      # 수집이 아예 안 돈 날과 구분되지 않고, 실제로 2026-08-15에 그렇게 읽혔다.
      #
      # 되돌린 상태로 검증을 한 번 더 돌린다. 여기서 통과하면 검증을 깨뜨린 것은
      # 코드가 아니라 그날 수집한 데이터이고, 되돌린 상태는 직전 배포와 같은 사실이므로
      # 내보내도 공개 데이터가 바뀌지 않는다. 여기서도 실패하면 코드가 깨진 것이니
      # 배포하지 않는다 — 그게 회귀 검증을 배포 앞에 둔 이유다.
      - name: 되돌린 상태 재검증
        id: verify_reverted
        if: always() && steps.guard.outputs.needed == 'true' && steps.verify.outcome != 'success'
        continue-on-error: true
        run: npm test

      # 배포는 Cloudflare Workers(워커 이름 er-radar)로 나간다. 자격증명이 없는
      # 복제·포크에서도 데이터 갱신은 계속되도록 토큰이 없으면 경고만 남기고 넘어간다.
      - name: 배포
        if: >-
          always() && steps.guard.outputs.needed == 'true' &&
          (steps.verify.outcome == 'success' || steps.verify_reverted.outcome == 'success')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다. 데이터는 저장소에만 갱신되었습니다."
            exit 0
          fi

          # 사실이 바뀌지 않은 날도 배포한다. 화면이 마지막 수집 시각을 표시하므로,
          # 배포를 건너뛰면 공개 페이지가 "언제 수집됐는지"를 낡은 값으로 보여준다.
          #
          # 화면이 읽는 데이터는 빌드 시점에 번들로 들어간다. 회귀 검증 단계의 빌드는
          # 실행 흔적 기록보다 앞서므로, 흔적을 담으려면 여기서 다시 빌드해야 한다.
          npm run build
          npx wrangler deploy

      # 수집 결과를 메일로 보낸다. 성공한 날뿐 아니라 실패한 날도 보내야 "메일이
      # 안 왔다"가 곧 "자동화가 멈췄다"로 읽힌다. SMTP 자격증명이 없으면 건너뛴다.
      #
      # curl로 직접 SMTP를 쓴다. 이 작업은 저장소 쓰기 권한을 갖고 있어서 서드파티
      # 액션을 끌어들이지 않는 편이 안전하다.
      - name: 수집 결과 메일 발송
        if: always() && steps.guard.outputs.needed == 'true'
        env:
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO || 'fry@kakao.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_ADMIN_CODE: ${{ secrets.DASHBOARD_ADMIN_CODE }}
        run: |
          if [ -z "$MAIL_SMTP_USER" ] || [ -z "$MAIL_SMTP_PASSWORD" ]; then
            echo "::warning::MAIL_SMTP_USER·MAIL_SMTP_PASSWORD 시크릿이 없어 메일 발송을 건너뜁니다."
            exit 0
          fi

          mkdir -p tmp
          mode=daily
          if [ "${{ steps.verify.outcome }}" != "success" ] || [ "${{ steps.collect.outcome }}" != "success" ]; then
            mode=failure
          fi

          # 되돌린 날은 저장소 파일이 어제 것이다. 커밋 단계가 떠 둔 사본이 있으면
          # 그걸 읽어서, 막힌 사실이 무엇이었는지를 메일에 그대로 적는다.
          audit=data/daily-update-audit.json
          candidates=public/data/news-candidates.json
          if [ -f tmp/blocked-audit.json ]; then
            audit=tmp/blocked-audit.json
            candidates=tmp/blocked-candidates.json
          fi

          node scripts/build-daily-report.mjs \
            --mode "$mode" \
            --out tmp/daily-report.eml \
            --audit "$audit" \
            --candidates "$candidates" \
            --from "$MAIL_SMTP_USER" \
            --to "$MAIL_TO" \
            --run-url "$RUN_URL" \
            --site-url "https://er-radar.er-radar.workers.dev/"

          # --user 값은 curl 프로세스 인자로 남지 않게 stdin 대신 환경변수 확장으로 넘긴다.
          curl --silent --show-error --ssl-reqd \
            --url "smtps://smtp.gmail.com:465" \
            --user "$MAIL_SMTP_USER:$MAIL_SMTP_PASSWORD" \
            --mail-from "$MAIL_SMTP_USER" \
            --mail-rcpt "$MAIL_TO" \
            --upload-file tmp/daily-report.eml

          echo "메일 발송 완료: $MAIL_TO (모드: $mode)"

      - name: 수집 요약
        if: always() && steps.guard.outputs.needed == 'true'
        run: |
          node -e "
            const batch = require('./public/data/news-candidates.json').batch;
            const audit = require('./data/daily-update-audit.json').runs[0] ?? {};
            console.log('배치:', batch.status, batch.kstDate, '| 주 수집원:', batch.primarySource);
            console.log('원문 확인:', JSON.stringify(batch.stats.urlResolution));
            console.log('반영:', audit.appliedCount ?? 0, '보류:', audit.skippedCount ?? 0);
          " >> "$GITHUB_STEP_SUMMARY"
