name: 공개 시드 Supabase 적재

# 화면은 하이드레이션 뒤 /api/published-facts로 DB를 읽어 시드를 덮어쓴다. 사실
# 데이터를 정정했으면 이 워크플로로 DB까지 맞춰야 공개 화면에 온전히 반영된다.
# (2026-08-24부터, 시드가 DB보다 더 최근 근거를 가진 경우에 한해 화면이 시드를
# 그대로 쓴다. lib/fact-reconciliation.mjs를 보라. 그래도 정정은 DB가 정본이다.)
#
# ⚠ 이 적재는 시드 값으로 교섭 사건 행을 통째로 덮어쓴다. 화면의 "데이터 수정"으로
# 승인된 정정은 DB에만 있고 시드에는 없으므로, 그대로 돌리면 되돌아간다. 2026-08-24
# 기준으로 sk-hynix(S5 잠정합의)·posco·kia가 여기에 해당한다. 돌리기 전에 아래로
# 무엇이 덮이는지 먼저 비교하라.
#
#   curl -s https://er-radar.er-radar.workers.dev/api/published-facts
#
#
# 적재 스크립트는 자연키 기준 멱등이라 여러 번 돌려도 같은 결과가 된다. 그래도 기본값은
# dry_run이다. 서비스 롤 키로 공개 데이터를 직접 쓰는 작업이라, 실제 쓰기는 매번
# 사람이 명시적으로 골라서 하게 둔다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "네트워크 없이 payload만 검증한다. 실제 적재하려면 false로 바꾼다"
        type: boolean
        default: true

concurrency:
  group: supabase-seed-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # 쓰기 전에 payload를 먼저 검증한다. 여기서 걸리면 DB를 건드리지 않는다.
      - name: payload 검증
        run: node scripts/load-supabase-seed.mjs --dry-run

      - name: Supabase 적재
        if: inputs.dry_run == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/load-supabase-seed.mjs

      # 업서트 자연키에 agreement_type이 들어 있어, 협약유형을 정정하면 기존 행이
      # 수정되지 않고 새 행이 하나 더 생긴다. 적재만으로는 옛 행이 그대로 남아
      # 화면이 계속 옛 값을 집는다. 지울 대상을 먼저 찍고 나서 지운다.
      - name: 시드에서 사라진 공개 사건 확인
        if: inputs.dry_run == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prune-supabase-orphans.mjs --dry-run

      - name: 시드에서 사라진 공개 사건 정리
        if: inputs.dry_run == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prune-supabase-orphans.mjs

      - name: 적재 결과 확인
        if: inputs.dry_run == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 공개 API가 시드와 같은 값을 돌려주는지 본다. 적재가 조용히 실패하면
          # 화면은 옛 값을 계속 보여주므로, 여기서 드러나야 한다.
          node -e "
            const seed = require('./data/current-2026-fact-seed.json');
            const expected = seed.records.find(
              (record) => record.companyId === 'posco' && record.bargainingYear === 2026,
            );
            console.log('시드 기준 포스코 2026:', expected.agreementType);
          "
          curl -sS "https://er-radar.er-radar.workers.dev/api/published-facts" \
            | node -e "
              let raw = '';
              process.stdin.on('data', (chunk) => { raw += chunk; });
              process.stdin.on('end', () => {
                const payload = JSON.parse(raw);
                const records = payload.records ?? payload;
                const posco = records.find(
                  (record) => record.companyId === 'posco' && record.bargainingYear === 2026,
                );
                console.log('공개 API 응답 출처:', payload.source ?? '(미표기)');
                console.log('공개 API 포스코 2026:', posco?.agreementType);
                if (posco?.agreementType !== 'WAGE') {
                  console.error('::error::적재 뒤에도 공개 API가 옛 협약유형을 돌려줍니다.');
                  process.exit(1);
                }
              });
            "
